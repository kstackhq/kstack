# Coverage. CI uploads each suite's report and Codecov merges every upload of
# a commit. CI's Coverage · Gate job (tools/coveragegate) reads the merged
# result and applies the gate, so Codecov posts no status or check of its own.

coverage:
  status:
    patch: false
    project: false

github_checks: false

# A language whose jobs the path filter skipped keeps its last report.
flag_management:
  default_rules:
    carryforward: true

# One number per language in Codecov's view of a commit.
component_management:
  individual_components:
    - component_id: go
      name: Go
      paths:
        - sidecar/**
    - component_id: typescript
      name: TypeScript
      paths:
        - src/**
    - component_id: rust
      name: Rust
      paths:
        - src-tauri/**

# No comment on the PR: Coverage · Gate reports.
comment: false

# A Go profile names files by import path.
fixes:
  - "github.com/kstackhq/kstack/::"

ignore:
  # Generated.
  - sidecar/graph/generated.go
  - sidecar/graph/model/models_gen.go
  - sidecar/grpc/authpb/**
  - sidecar/grpc/pokepb/**
  - src/gql/**
  - src/routeTree.ts
  # Build and CI scripts, run by hand or by go run.
  - sidecar/scripts/**
  # The webview's entry point and the test harness.
  - src/main.tsx
  - src/test-utils.tsx
  # Rust files with no line a test can reach; a file with one marks the rest
  # with `// coverage:ignore-start <reason>` instead. The entry point:
  - src-tauri/src/main.rs
  # The macOS menu bar's construction: AppKit builds menus on the main thread,
  # which no test runs on. What an item does is tested in app_menu/mod.rs.
  - src-tauri/src/app_menu/macos.rs
  # The OS glue that registers for wake and network notifications on the
  # system bus or the Win32 API.
  - src-tauri/src/wake/linux.rs
  - src-tauri/src/wake/windows.rs
