name: coverage-spread

# Measures how far each coverage gate's number moves between runs of the same
# commit, to size the tolerance under each threshold. Every Go cell runs the
# suite uncached (-count=1): a cached package replays its old profile and
# measures nothing. A run is three Go cells and one TypeScript cell per entry
# in `runs`; the report job prints each gate's spread and the blocks that moved.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Run labels, as a JSON array; one run per entry
        default: "[1,2,3,4,5]"

# Twenty runs fill the macOS runners for hours; a second dispatch waits.
concurrency:
  group: coverage-spread
  cancel-in-progress: false

jobs:
  go:
    name: Go · Coverage · ${{ matrix.os }} · run ${{ matrix.run }}
    strategy:
      fail-fast: false
      # Keep the runners in step with the go-coverage job in ci.yml.
      matrix:
        # A JSON array, since an expression cannot split a list.
        run: ${{ fromJSON(inputs.runs || '[1,2,3,4,5]') }}
        os:
          - linux
          - darwin
          - windows
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: darwin
            runner: xcode-27
          - os: windows
            runner: windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # `runs` is free text, so it reaches a shell only through the environment.
    env:
      PROFILE: coverage-${{ matrix.os }}-${{ matrix.run }}.out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go · Coverage's cache, restored to skip compiling what that job built.
      # This job never saves one, or its cells would push CI's caches out.
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-sandbox: "true"
          go-cache-key: go-coverage-${{ matrix.runner }}
      - name: Measure coverage
        working-directory: ./sidecar
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -count=1
          SSH_AUTH_SOCK: ""
        shell: bash
        run: go run scripts/coverage.go -out "$RUNNER_TEMP/$PROFILE"
      - name: Upload the profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ matrix.os }}-${{ matrix.run }}
          path: ${{ runner.temp }}/${{ env.PROFILE }}
          retention-days: 14

  typescript:
    name: TypeScript · Coverage · run ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(inputs.runs || '[1,2,3,4,5]') }}
    runs-on: ubuntu-24.04
    env:
      SUMMARY: coverage-js-${{ matrix.run }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Measure coverage
        run: go run scripts/coverage-js.go -nogate -summary "$RUNNER_TEMP/$SUMMARY"
      - name: Upload the summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-js-${{ matrix.run }}
          path: ${{ runner.temp }}/${{ env.SUMMARY }}
          retention-days: 14

  # Reports over whichever runs finished: a run missing a cell is left out of
  # the Go spread, not the whole report.
  report:
    name: Report the spread
    needs:
      - go
      - typescript
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-*
          path: ${{ runner.temp }}/go
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-js-*
          path: ${{ runner.temp }}/js
          merge-multiple: true
      - name: Go spread
        working-directory: ./sidecar
        run: go run scripts/coverage.go -spread -dir ${{ runner.temp }}/go
      - name: TypeScript spread
        if: ${{ !cancelled() }}
        shell: bash
        run: go run scripts/coverage-js.go -spread "$RUNNER_TEMP"/js/coverage-js-*.json
