name: stress

# Runs every Go test under the race detector with the CPU count, the order and
# the repetitions varied, to find ordering bugs a single PR run passes. A red
# run means a concurrency bug was found and nothing else.

permissions:
  contents: read

on:
  # After the nightly ci run, when no one waits on the runners.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Repetitions of each test (-count)
        default: "3"
      cpu:
        description: GOMAXPROCS values to run each test under (-cpu)
        default: "1,4"

env:
  COUNT: ${{ inputs.count || '3' }}
  CPU: ${{ inputs.cpu || '1,4' }}

jobs:
  stress:
    name: Go · Stress
    strategy:
      fail-fast: false
      # Keep in step with full-matrix in ci.yml; anchors do not cross files.
      matrix:
        os:
          - linux
          - macos-15
          - macos-26
          - macos-27
          - windows
        arch:
          - amd64
          - arm64
        exclude:
          # The macOS 27 image is Apple silicon alone.
          - os: macos-27
            arch: amd64
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
          - os: macos-15
            arch: arm64
            runner: macos-15
          - os: macos-26
            arch: arm64
            runner: macos-26
          - os: macos-26
            arch: amd64
            runner: macos-26-intel
          - os: macos-27
            arch: arm64
            runner: xcode-27
          - os: windows
            arch: amd64
            runner: windows-2025-vs2026
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # The race detector does not support windows/arm64.
      RACE: ${{ !(matrix.os == 'windows' && matrix.arch == 'arm64') }}
      MATRIX_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-sandbox: "true"
          # Go · Build and Test's cache, restored to skip compiling. This job
          # never saves one: its flags differ from a PR's.
          go-cache-key: go-test-${{ matrix.runner }}
      # -timeout sits under timeout-minutes, so a hang fails the test binary
      # with a goroutine dump rather than the runner killing the job.
      - name: Run tests under stress
        working-directory: ./sidecar
        shell: bash
        run: |
          race_flag=""
          if [ "$RACE" = true ]; then
            race_flag=-race
          fi
          mkdir -p stress
          status=0
          go test $race_flag -cpu "$CPU" -shuffle=on -count="$COUNT" -timeout 90m -json ./... \
            > stress/stress.json || status=$?
          go run scripts/stress.go -cpu "$CPU" -count "$COUNT" -race="$RACE" \
            -runner "$MATRIX_RUNNER" stress/stress.json
          exit "$status"
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.runner }}
          path: sidecar/stress/
          retention-days: 14

  # Checks out nothing, so no repo code runs with a write token. Artifact text
  # reaches gh through --body-file and quoted variables, never the command line.
  report:
    name: Report failures
    needs: stress
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      # Reads which stress jobs failed, including those that left no artifact.
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: stress-*
          path: stress/
      - name: Open or update issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          gh label create stress --force --color B60205 \
            --description "A concurrency bug the nightly stress run found"
          gh issue list --label stress --state open --limit 1000 --json number,title > open.json

          # Comments on the open issue with this title, or opens one.
          file_issue() {
            local title=$1 body=$2 number
            number=$(jq -r --arg t "$title" 'map(select(.title == $t))[0].number // empty' open.json)
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$body"
            else
              gh issue create --title "$title" --label stress --body-file "$body"
            fi
          }

          # Every runner whose stress job did not pass, by its runs-on label.
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name | startswith("Go · Stress"))
                  | select(.conclusion != "success" and .conclusion != "skipped")
                  | .labels[0]' > failed-runners.txt

          reports=(stress/*/failures.json)
          if [ ${#reports[@]} -gt 0 ]; then
            jq -s '[.[] | .runner as $r | .failures[] | . + {runner: $r}]' "${reports[@]}" > failures.json
          else
            echo '[]' > failures.json
          fi

          # One issue per failing test, whatever -cpu values it failed under.
          jq -c 'group_by([.package, .test])[]' failures.json | while read -r group; do
            title=$(jq -r '"Stress: \(.[0].test) fails in \(.[0].package)"' <<<"$group")
            jq -r --arg run "$RUN_URL" '
              "The [nightly stress run](\($run)) found `\(.[0].test)` failing in `\(.[0].package)`.\n\n"
              + "Each command runs the whole package from `sidecar/`, since the seed orders all of it.\n\n"
              + (sort_by(.runner, .cpu) | map(
                  "- **\(.runner)**, `-cpu \(.cpu)`, seed `\(.seed)`"
                  + (if .timedOut then ", timed out" else "" end)
                  + "\n\n  ```sh\n  \(.command)\n  ```\n"
                ) | join("\n"))
            ' <<<"$group" > body.md
            file_issue "$title" body.md
          done

          # A failed job that names no failing test: setup, build, a package
          # that failed outside a test, or a timeout the test binary missed.
          : > outside.md
          while read -r runner; do
            report="stress/stress-$runner/failures.json"
            if [ ! -f "$report" ]; then
              echo "- **$runner**: no test report" >> outside.md
            elif jq -e '(.outside | length) > 0 or (.failures | length) == 0' "$report" > /dev/null; then
              jq -r --arg r "$runner" '"- **\($r)**: " + (if (.outside | length) > 0
                then "failed outside a test in " + (.outside | map("`\(.)`") | join(", "))
                else "failed with no failing test" end)' "$report" >> outside.md
            fi
          done < failed-runners.txt
          if [ -s outside.md ]; then
            { echo "The [nightly stress run]($RUN_URL) failed outside a test on:"; echo; cat outside.md; } > body.md
            file_issue "Stress run failed outside a test" body.md
          fi
