name: audit

permissions:
  contents: read

# Audits the whole dependency tree, so a newly published advisory fails a run
# the maintainers own. A pull request is checked only for the advisories it
# brings in, by ci.yml's dependency review jobs.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

env:
  # Rust · Audit borrows ci.yml's Rust · Vet cache, and rust-cache keys on
  # CARGO_* variables, so this matches ci.yml's.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  go-audit:
    name: Go · Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      # tools/go.mod pins govulncheck, where Dependabot moves it.
      - name: Run govulncheck
        working-directory: ./tools
        run: go tool govulncheck -C ../sidecar ./...

  rust-audit:
    name: Rust · Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          # Nothing here compiles worth saving, so it borrows Rust · Vet's
          # registry and index.
          rust-cache-key: rust-vet-ubuntu-24.04
      # The action's release fixes cargo-audit's version and checksums, so
      # Dependabot moves cargo-audit when it moves the action.
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - name: Run cargo audit
        working-directory: ./src-tauri
        run: cargo audit --deny unsound --deny unmaintained

  typescript-audit:
    name: TypeScript · Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate

  # GitHub's dependency graph reads only pnpm-lock.yaml's first YAML document,
  # which pins pnpm itself, and Dependabot's alerts and security updates read
  # the graph.
  typescript-submit:
    name: TypeScript · Submit dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Build the snapshot
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: sh scripts/npm-dependency-snapshot.sh "$SHA" "$REF" >"$RUNNER_TEMP/snapshot.json"
      - name: Submit the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot.json"

  # A failed audit on main opens an issue, or comments on the one still open,
  # so it reaches a maintainer without anyone watching the Actions tab.
  report:
    name: Report failure
    needs:
      - go-audit
      - rust-audit
      - typescript-audit
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Fix the dependency audit failing on main"
          number=$(gh issue list --state open --label security \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --label security --body "## Summary

          A dependency audit failed on main: $RUN_URL

          A newly published advisory, or a crate newly marked unsound or unmaintained, can fail it with no change on our side.

          ## Done when

          - The audit workflow passes on main."
          fi
