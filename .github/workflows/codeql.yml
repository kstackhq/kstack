name: codeql

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only main saves the Go and Rust caches, which every pull request reads. A
  # pull request saving its own copy would push the repo past its cache limit.
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # A pull request analyzes a language only when a path it reads changed. A
  # push, the schedule or a dispatch analyzes them all, so main's baseline
  # stays complete.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      skipped: ${{ steps.skipped.outputs.categories || '[]' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - .github/actions/setup-environment/**
              - .github/workflows/codeql.yml
            go:
              - *shared
              - proto/**
              - scripts/**/*.go
              - sidecar/**
              - tools/**
            typescript:
              - *shared
              - src/**
              - package.json
              - pnpm-lock.yaml
              - '*.ts'
              - '*.js'
              - '*.mjs'
            rust:
              - *shared
              - .github/actions/stub-sidecar/**
              - proto/**
              - src-tauri/**

      # The categories of every language the pull request skips, for reuse-main.
      - id: skipped
        if: github.event_name == 'pull_request'
        env:
          CHANGED: ${{ toJSON(steps.filter.outputs) }}
        run: |
          jq -c '[
            (select(.go != "true") | "/language:go/os:" + ("linux", "macos", "windows")),
            (select(.typescript != "true") | "/language:javascript-typescript"),
            (select(.rust != "true") | "/language:rust/os:" + ("linux", "macos", "windows"))
          ]' <<<"$CHANGED" | sed 's/^/categories=/' >> "$GITHUB_OUTPUT"

  # CodeQL analyzes only the files the runner's OS compiles, so Go and Rust
  # run once per OS, each under its own category.
  go:
    name: CodeQL · Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: codeql-${{ matrix.runner }}

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual

      - name: Build sidecar
        working-directory: ./sidecar
        run: go build ./...

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:go/os:${{ matrix.os }}

      - name: Save Go cache
        if: env.CACHE_SAVE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  typescript:
    name: CodeQL · TypeScript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  # The extractor runs build.rs, so the job needs what a real build does: the
  # toolchain, Tauri's Linux packages and a sidecar binary for tauri-build to
  # find. Without them OUT_DIR and cfg(desktop) are unset.
  rust:
    name: CodeQL · Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          rust-cache-key: codeql-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_SAVE }}

      - uses: ./.github/actions/stub-sidecar

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none

      # The extractor's cargo check builds into a fresh scratch directory
      # unless told otherwise; this is the one the Rust cache restores.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        with:
          category: /language:rust/os:${{ matrix.os }}

  # Leaves one copy of each cache on main, the newest. It runs after the Rust
  # jobs because rust-cache saves in a post step.
  cache-prune:
    name: Caches · Prune
    needs:
      - go
      - rust
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Prune caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/prune-caches.sh "$GITHUB_REF"

  # A skipped category's files are unchanged, so uploading main's analysis
  # under it lets code scanning still compare the pull request to main, and
  # find nothing new or fixed there. An empty SARIF would instead show main's
  # open alerts as fixed.
  reuse-main:
    name: CodeQL · Reuse main (${{ matrix.category }})
    needs: changes
    if: needs.changes.outputs.skipped != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJSON(needs.changes.outputs.skipped) }}
    steps:
      - name: Download main's analysis
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ matrix.category }}
        run: |
          # A cancelled run on main records a failed analysis, which has no SARIF.
          id=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?ref=refs/heads/main&tool_name=CodeQL&per_page=100" \
            --jq "[.[] | select(.category == \"$CATEGORY\" and .error == \"\")][0].id")
          if [ -z "$id" ] || [ "$id" = null ]; then
            echo "::error::main has no successful CodeQL analysis for $CATEGORY"
            exit 1
          fi
          gh api -H "Accept: application/sarif+json" \
            "repos/$GITHUB_REPOSITORY/code-scanning/analyses/$id" > "$RUNNER_TEMP/main.sarif"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/main.sarif
          category: ${{ matrix.category }}
