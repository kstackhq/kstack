name: codeql

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - wip/**
  pull_request:
    branches:
      - main
      - wip/**
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only main saves the Go and Rust caches, which every pull request reads. A
  # pull request saving its own copy would push the repo past its cache limit.
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # A pull request analyzes a language only when a path it reads changed. A
  # push, the schedule or a dispatch analyzes them all, so the baseline of
  # main and of each wip branch stays complete.
  #
  # GitHub starts push and schedule runs in forks too. Outside kstackhq/kstack
  # Plan runs only for a PR or a dispatch, and every other job needs it, so a
  # fork's automatic run skips whole. A job whose `if:` runs past a skipped
  # need (`always()`) checks that Plan succeeded.
  changes:
    name: Plan
    if: >-
      github.repository == 'kstackhq/kstack'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      skipped: ${{ steps.skipped.outputs.analyses || '[]' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - .github/actions/setup-environment/**
              - .github/workflows/codeql.yml
            go:
              - *shared
              - cli/**
              - proto/**
              - scripts/**/*.go
              - sidecar/**
              - tools/**
            typescript:
              - *shared
              - src/**
              - package.json
              - pnpm-lock.yaml
              - '*.ts'
              - '*.js'
              - '*.mjs'
            rust:
              - *shared
              - .github/actions/stub-sidecar/**
              - proto/**
              - src-tauri/**

      # The language and OS of every analysis the pull request skips, for
      # reuse-base's matrix.
      - id: skipped
        if: github.event_name == 'pull_request'
        env:
          CHANGED: ${{ toJSON(steps.filter.outputs) }}
        run: |
          jq -c '[
            (select(.go != "true") | {lang: "go", os: ("linux", "macos", "windows")}),
            (select(.typescript != "true") | {lang: "typescript"}),
            (select(.rust != "true") | {lang: "rust", os: ("linux", "macos", "windows")})
          ]' <<<"$CHANGED" | sed 's/^/analyses=/' >> "$GITHUB_OUTPUT"

  # CodeQL analyzes only the files the runner's OS compiles, so Go and Rust
  # run once per OS, each under its own category.
  go:
    name: Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: codeql-${{ matrix.runner }}

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual

      - name: Build sidecar
        working-directory: ./sidecar
        run: go build ./...

      - name: Build CLI
        working-directory: ./cli
        run: go build ./...

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:go/os:${{ matrix.os }}

      - name: Save Go cache
        if: env.CACHE_SAVE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  # The extractor runs build.rs, so the job needs what a real build does: the
  # toolchain, Tauri's Linux packages and a sidecar binary for tauri-build to
  # find. Without them OUT_DIR and cfg(desktop) are unset.
  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          rust-cache-key: codeql-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_SAVE }}

      - uses: ./.github/actions/stub-sidecar

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none

      # The extractor's cargo check builds into a fresh scratch directory
      # unless told otherwise; this is the one the Rust cache restores.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        with:
          category: /language:rust/os:${{ matrix.os }}

  # Leaves one copy of each cache on main, the newest. It runs after the Rust
  # jobs because rust-cache saves in a post step.
  cache-prune:
    name: Caches · Prune
    needs:
      - changes
      - go
      - rust
    if: always() && needs.changes.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/prune-caches
      - uses: ./.github/actions/prune-caches

  # A skipped category's files are unchanged, so uploading the base branch's
  # analysis under it lets code scanning still compare the pull request to its
  # base, and find nothing new or fixed there. An empty SARIF would instead
  # show the base's open alerts as fixed.
  #
  # It uploads after the real analyses: code scanning grades the check when
  # uploads first arrive and reports any category still missing as not found.
  #
  # The name leaves out the matrix so a skipped job, whose matrix GitHub never
  # expands, shows plain text; GitHub appends each entry's values to it.
  reuse-base:
    name: Reuse base
    needs:
      - changes
      - go
      - typescript
      - rust
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.skipped != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.skipped) }}
    steps:
      - id: category
        name: Name the category
        env:
          MATRIX_LANG: ${{ matrix.lang }}
          OS: ${{ matrix.os }}
        run: |
          case "$MATRIX_LANG" in
            typescript) echo "category=/language:javascript-typescript" ;;
            *) echo "category=/language:$MATRIX_LANG/os:$OS" ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Download the base branch's analysis
        env:
          GH_TOKEN: ${{ github.token }}
          CATEGORY: ${{ steps.category.outputs.category }}
        run: |
          # A cancelled run records a failed analysis, which has no SARIF. A
          # wip branch has none until its first push run, so a pull request
          # into it fails here until then.
          id=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?ref=refs/heads/$GITHUB_BASE_REF&tool_name=CodeQL&per_page=100" \
            --jq "[.[] | select(.category == \"$CATEGORY\" and .error == \"\")][0].id")
          if [ -z "$id" ] || [ "$id" = null ]; then
            echo "::error::$GITHUB_BASE_REF has no successful CodeQL analysis for $CATEGORY; push to it to run one"
            exit 1
          fi
          gh api -H "Accept: application/sarif+json" \
            "repos/$GITHUB_REPOSITORY/code-scanning/analyses/$id" > "$RUNNER_TEMP/base.sarif"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/base.sarif
          category: ${{ steps.category.outputs.category }}
