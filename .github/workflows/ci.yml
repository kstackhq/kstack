name: ci

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  # A run on main updates the Go caches every PR reads.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cache-mode:
        description: >-
          use: restore the Go and Rust caches, save none. update: also save a
          new Go cache. rebuild: start the Go cache from empty and save it.
          Off main, a saved cache is that branch's alone; PRs never read it.
        type: choice
        options:
          - use
          - update
          - rebuild
        default: use

# A PR's new push cancels its last run. Every other run has a group of its own,
# so a run on main is never cancelled, which would save no cache, nor left
# pending behind another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # use, update or rebuild: the one place that decides whether a run saves a
  # Go or Rust cache. An update or a rebuild saves a new Go cache per job and
  # runner; the one it replaces is never restored again, so it is the first
  # GitHub evicts. Rust saves when its Cargo.lock key misses, so it has nothing
  # to update or rebuild. A dispatch takes its input; a push to main updates;
  # a PR carries no inputs, so it uses, since a PR saving its own copy pushes
  # the repo past its cache limit.
  CACHE_MODE: ${{ inputs.cache-mode || github.ref == 'refs/heads/main' && 'update' || 'use' }}
  # Full debug info swells the Rust caches and slows linking; line tables keep
  # file:line in test backtraces. Workflow-wide, since rust-cache keys on CARGO_*
  # variables and audit.yml's Rust · Audit borrows Rust · Vet's cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # A pull request runs a language's jobs only when a path they read changed.
  # A push or a dispatch runs them all, so main stays the safety net for a path
  # a filter misses and keeps saving the caches PRs read. Each gated job is the
  # first of its chain; the jobs that need it skip with it.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      shell: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shell == 'true' }}
      yaml: ${{ github.event_name != 'pull_request' || steps.filter.outputs.yaml == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Go covers what Sandbox · AppArmor builds and runs. Rust builds
          # against a stub sidecar, so the sidecar is not its input.
          filters: |
            shared: &shared
              - .github/actions/setup-environment/**
              - .github/workflows/ci.yml
            go:
              - *shared
              - Makefile
              - proto/**
              - scripts/**
              - sidecar/**
              - src-tauri/linux/**
              - tools/**
            rust:
              - *shared
              - .github/actions/stub-sidecar/**
              - proto/**
              - src-tauri/**
            typescript:
              - *shared
              - .gitignore
              - Makefile
              - public/**
              - src/**
              - sidecar/graph/schema.graphqls
              - scripts/coverage-js.go
              - scripts/coverage-threshold
              - scripts/coverage-tolerance
              - .oxfmtrc.json
              - codegen.ts
              - eslint.config.ts
              - index.html
              - index.test.ts
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig*.json
              - vite.config.ts
              - vitest.setup.ts
            shell:
              - .github/workflows/ci.yml
              - '**/*.sh'
            yaml:
              - .github/**
              - .gitignore
              - .yamllint.yml
              - .yamllintignore
              - Makefile
              - '**/*.yml'
              - '**/*.yaml'

  ##############################
  # Pre-flight jobs
  ##############################

  go-lint:
    name: Go · Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Run linter
        working-directory: ./sidecar
        run: test -z "$(gofmt -l .)"

  go-vet:
    name: Go · Vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: ${{ github.job }}-ubuntu-24.04
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Run vetter
        working-directory: ./sidecar
        run: go vet ./...
      # The Windows runners run tests alone, so this is the one place the
      # _windows.go files are vetted.
      - name: Run vetter (GOOS=windows)
        working-directory: ./sidecar
        run: GOOS=windows go vet ./...
      - name: Check sidecar dependencies
        run: sh scripts/check-sidecar-deps.sh
      - name: Check go fix
        run: sh scripts/check-go-fix.sh
      # The coverage scripts are build-ignored, so ./... runs none of their tests.
      - name: Test the coverage scripts
        run: |
          go test scripts/coverage-js.go scripts/coverage-js_test.go
          cd sidecar && go test scripts/coverage.go scripts/coverage_test.go
      # After both passes, so the cache holds the Windows target's builds too,
      # and a failed job leaves the last cache the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  # Only CI · Result waits on it: a run takes minutes, so the tests start
  # beside it rather than after it.
  go-staticcheck:
    name: Go · Staticcheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: ${{ github.job }}-ubuntu-24.04
          go-cache-mode: ${{ env.CACHE_MODE }}
      # Staticcheck keeps its analysis apart from GOCACHE, so it has a cache of
      # its own, kept by the same CACHE_MODE rules as the Go cache.
      - name: Restore staticcheck cache
        if: env.CACHE_MODE != 'rebuild'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/staticcheck
          # Never matches, so restore-keys finds the newest cache.
          key: doesntexist
          restore-keys: staticcheck-ubuntu-24.04-run-
      # tools/go.mod pins staticcheck, where Dependabot moves it.
      - name: Run staticcheck
        env:
          STATICCHECK_CACHE: ${{ runner.temp }}/staticcheck
        run: sh scripts/staticcheck.sh
      # After the run, so a failed job leaves the last caches the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}
      - name: Save staticcheck cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/staticcheck
          key: staticcheck-ubuntu-24.04-run-${{ github.run_id }}

  rust-lint:
    name: Rust · Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
      - name: Run format check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check

  rust-vet:
    name: Rust · Vet
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      # Keep in step with the stress job's matrix in stress.yml.
      matrix: &full-matrix
        os:
          - linux
          - macos-15
          - macos-26
          - macos-27
          - windows
        arch:
          - amd64
          - arm64
        exclude:
          # The macOS 27 image is Apple silicon alone.
          - os: macos-27
            arch: amd64
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
          - os: macos-15
            arch: arm64
            runner: macos-15
          - os: macos-26
            arch: arm64
            runner: macos-26
          - os: macos-26
            arch: amd64
            runner: macos-26-intel
          - os: macos-27
            arch: arm64
            runner: xcode-27
          - os: windows
            arch: amd64
            runner: windows-2025-vs2026
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - uses: ./.github/actions/stub-sidecar
      - name: Run clippy
        working-directory: ./src-tauri
        run: cargo clippy --all -- -D warnings

  shell-lint:
    name: Shell · Lint
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck scripts/*.sh src-tauri/linux/*.sh

  yaml-lint:
    name: YAML · Lint
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # The token turns on zizmor's online audits, which check each pin's
      # commit and version comment against the action's repository.
      - name: Run yamllint, actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-yaml

  typescript-lint:
    name: TypeScript · Lint
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  ###########################
  # Dependency review jobs
  ###########################

  # A pull request fails only for the advisories it brings in. audit.yml
  # audits the whole tree daily and on main.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # Compares the base and head dependency graphs, which hold the Go and
      # Cargo packages; npm is TypeScript · Dependency review's. Every scope
      # counts, as in the audits.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

  # A fork's token cannot submit to the dependency graph, so npm compares
  # pnpm audit on the base and on the head instead.
  typescript-dependency-review:
    name: TypeScript · Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Fail on advisories new to the head
        run: sh scripts/audit-npm-diff.sh base .

  ###########################
  # Test jobs
  ###########################

  # Go · Vet already type-checks the build; this links the real binary, then
  # runs the tests under the same cache.
  go-test:
    name: Go · Build and Test
    needs:
      - go-lint
      - go-vet
    strategy:
      fail-fast: false
      matrix: *full-matrix
    runs-on: ${{ matrix.runner }}
    steps:
      # The whole history, so every file has the commit that last changed it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-sandbox: "true"
          go-cache-key: ${{ github.job }}-${{ matrix.runner }}
          go-cache-mode: ${{ env.CACHE_MODE }}
      # Go's test cache keys a test on the files it reads by modification time,
      # which a checkout resets, so a test reading a repo file would never
      # replay a restored result.
      - name: Date files by their last commit
        run: go run scripts/restore-mtime.go
      # Outside the tree: a test that lists sidecar/ would see a new binary on
      # every run.
      - name: Build
        working-directory: ./sidecar
        run: go build -o ${{ runner.temp }}
      # The race detector does not support windows/arm64, so it alone runs the
      # tests without -race.
      - name: Run tests
        if: ${{ matrix.os == 'windows' && matrix.arch == 'arm64' }}
        working-directory: ./sidecar
        run: go test ./...
      # -race also turns on checkptr, which spends a quarter of agent/chat's
      # CPU checking modernc's SQLite. It is off there alone; our code keeps it.
      # The login shell's tests read SSH_AUTH_SOCK, so its value keys their
      # cached results, and on macOS launchd sets a new path on every boot.
      # -short: a sweep a test shrinks under it runs whole in the stress workflow.
      - name: Run race tests
        if: ${{ !(matrix.os == 'windows' && matrix.arch == 'arm64') }}
        working-directory: ./sidecar
        env:
          SSH_AUTH_SOCK: ""
        run: go test -race -short -gcflags='modernc.org/...=-d=checkptr=0' ./...
      # After every test passed, so a failed job leaves its runner's last cache
      # the newest. The test flags must match a PR's, or a PR replays nothing.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  go-coverage:
    name: Go · Coverage · ${{ matrix.os }}
    needs:
      - go-lint
      - go-vet
    strategy:
      fail-fast: false
      # One runner per OS: every platform split in the sidecar is by OS, none
      # by architecture, so three profiles hold every file. macOS 27 is the
      # release users run; nothing in the sidecar branches on the macOS version.
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: darwin
            runner: xcode-27
          - os: windows
            runner: windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    # Twice the two suite runs' -timeout, so a hang fails the test binary with
    # a goroutine dump before the runner kills the job.
    timeout-minutes: 60
    steps:
      # The whole history, for the same reason as Go · Build and Test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          # macOS skips its Seatbelt tests without KSTACK_REQUIRE_SANDBOX=1.
          setup-sandbox: "true"
          go-cache-key: ${{ github.job }}-${{ matrix.runner }}
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Date files by their last commit
        run: go run scripts/restore-mtime.go
      # Built as scripts/build-sidecar.go ships it, so the run tests the
      # pure-Go os/user and net resolver the release uses. A cached test
      # replays its coverage with it. SSH_AUTH_SOCK is pinned as in Go · Build
      # and Test, since its value keys the login shell's cached results.
      - name: Measure coverage
        working-directory: ./sidecar
        env:
          CGO_ENABLED: "0"
          SSH_AUTH_SOCK: ""
        run: go run scripts/coverage.go -out ${{ runner.temp }}/coverage-${{ matrix.os }}.out
      - name: Upload the profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ matrix.os }}
          path: ${{ runner.temp }}/coverage-${{ matrix.os }}.out
          retention-days: 7
      # After the profile is written, so a failed job leaves the last cache the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  go-coverage-gate:
    name: Go · Coverage
    needs: go-coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-*
          path: ${{ runner.temp }}/coverage
          merge-multiple: true
      # One union over the three OSes: a block counts as covered if any OS
      # covered it. The second line gates the files Linux does not compile,
      # which are too few to move the first.
      - name: Check coverage against the thresholds
        working-directory: ./sidecar
        run: >-
          go run scripts/coverage.go -report
          -linux ${{ runner.temp }}/coverage/coverage-linux.out
          -darwin ${{ runner.temp }}/coverage/coverage-darwin.out
          -windows ${{ runner.temp }}/coverage/coverage-windows.out

  # Builds Kstack's own bwrap and pasta, loads their AppArmor profiles through
  # the .deb's postinst on a stock 24.04, where user namespaces are restricted,
  # and runs the sandbox's chains through them as an ordinary user.
  sandbox-apparmor:
    name: Sandbox · AppArmor · Ubuntu 24.04
    needs:
      - go-lint
      - go-vet
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      # Unrestricted, the check proves nothing about the profiles.
      - name: Assert user namespaces are restricted
        run: test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
      - name: Build bwrap and pasta
        run: make bwrap pasta
      - name: Build the sidecar
        working-directory: ./sidecar
        run: go build -o kstack-sidecar .
      # Where the .deb puts them, since each profile attaches by path.
      - name: Install as the .deb does
        run: |
          sudo install -D -m 0755 sidecar/kstack-sidecar /usr/bin/kstack-sidecar
          sudo install -D -m 0755 src-tauri/linux/bwrap /usr/lib/kstack/bwrap
          sudo install -D -m 0755 src-tauri/linux/pasta /usr/lib/kstack/pasta
          sudo install -D -m 0644 src-tauri/linux/kstack-bwrap /usr/lib/kstack/apparmor/kstack-bwrap
          sudo install -D -m 0644 src-tauri/linux/kstack-pasta /usr/lib/kstack/apparmor/kstack-pasta
          sudo sh src-tauri/linux/postinst.sh configure
          sudo aa-status | grep -E 'kstack_(bwrap|pasta)'
      - name: Run the sandbox's chains
        run: scripts/check-sandbox-chain.sh

  typescript-coverage:
    name: TypeScript · Coverage
    needs:
      - typescript-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check coverage against the threshold
        run: make cover-js

  # Rust · Vet's clippy already type-checks the build; this links the real
  # binary, then runs the tests under the same cache.
  rust-test:
    name: Rust · Build and Test
    needs:
      - rust-lint
      - rust-vet
    strategy:
      fail-fast: false
      matrix: *full-matrix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - uses: ./.github/actions/stub-sidecar
      - name: Build
        working-directory: ./src-tauri
        run: cargo build
      - name: Run tests
        working-directory: ./src-tauri
        run: cargo test

  typescript-test:
    name: TypeScript · Test
    needs:
      - typescript-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test run

  ###########################
  # Build jobs
  ###########################

  typescript-build:
    name: TypeScript · Build
    needs:
      - typescript-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  # The one job to require: a skipped job reports as success, but a skipped
  # matrix job reports only under its unexpanded name.
  ci-result:
    name: CI · Result
    if: always()
    needs:
      - changes
      - go-lint
      - go-vet
      - go-staticcheck
      - rust-lint
      - rust-vet
      - shell-lint
      - yaml-lint
      - typescript-lint
      - dependency-review
      - typescript-dependency-review
      - go-test
      - go-coverage
      - go-coverage-gate
      - sandbox-apparmor
      - typescript-coverage
      - rust-test
      - typescript-test
      - typescript-build
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
