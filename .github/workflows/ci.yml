name: ci

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  # A run on main updates the Go caches every PR reads.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cache-mode:
        description: >-
          use: restore the Go and Rust caches, save none. update: also save a
          new Go cache. rebuild: start the Go cache from empty and save it.
          Off main, a saved cache is that branch's alone; PRs never read it.
        type: choice
        options:
          - use
          - update
          - rebuild
        default: use

# A PR's new push cancels its last run. Pushes to main share one group that
# never cancels a started run, which would save no cache: a newer push replaces
# the one run pending behind it. A dispatch has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # use, update or rebuild: the one place that decides whether a run saves a
  # Go or Rust cache. An update or a rebuild saves a new Go cache per job and
  # runner, and Caches · Prune deletes the one it replaces. Rust saves when its
  # Cargo.lock key misses, so it has nothing to update or rebuild. A dispatch
  # takes its input; a push to main updates; a PR carries no inputs, so it
  # uses, since a PR saving its own copy pushes the repo past its cache limit.
  CACHE_MODE: ${{ inputs.cache-mode || github.ref == 'refs/heads/main' && 'update' || 'use' }}
  # Full debug info swells the Rust caches and slows linking; line tables keep
  # file:line in test backtraces. Workflow-wide, since rust-cache keys on CARGO_*
  # variables and audit.yml's Rust · Audit borrows Rust · Vet's cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # A pull request runs a language's jobs only when a path they read changed.
  # A push or a dispatch runs them all, so main stays the safety net for a path
  # a filter misses and keeps saving the caches PRs read. Each language job
  # checks its own filter, so tests start beside lint and vet rather than
  # after them.
  #
  # GitHub starts push and schedule runs in forks too. Outside kstackhq/kstack
  # Plan runs only for a PR or a dispatch, and every other job needs it, so a
  # fork's automatic run skips whole. A job whose `if:` runs past a skipped
  # need (`always()`) checks that Plan succeeded.
  changes:
    name: Plan
    if: >-
      github.repository == 'kstackhq/kstack'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      cache-mode: ${{ env.CACHE_MODE }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      shell: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shell == 'true' }}
      yaml: ${{ github.event_name != 'pull_request' || steps.filter.outputs.yaml == 'true' }}
      design: ${{ github.event_name != 'pull_request' || steps.filter.outputs.design == 'true' }}
      # Matrix legs, as JSON: the ones this event runs, and the pull request's.
      legs: ${{ steps.legs.outputs.legs }}
      pull-request-legs: ${{ steps.legs.outputs.pull-request-legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Shared with coverage.yml.
          filters: .github/ci-config/path-filters.yml
      # A pull request runs one runner per OS, the entries runners.json marks
      # pull_request. A push or a dispatch runs every runner, and saves the
      # caches PRs and stress.yml read.
      # → docs/adr/2026-11-10-a-pull-request-runs-one-leg-per-os.md
      # The PR legs hold one macOS version, so their os drops it: macos-27
      # becomes macos. The full set keeps it to tell its macOS legs apart.
      - id: legs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          runners=.github/ci-config/runners.json
          all_legs=$(jq -c . "$runners")
          pull_request_legs=$(jq -c 'map(select(.pull_request) | .os |= sub("-[0-9]+$"; ""))' "$runners")
          if [ "$EVENT_NAME" = pull_request ]; then
            legs=$pull_request_legs
          else
            legs=$all_legs
          fi
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "pull-request-legs=$pull_request_legs" >> "$GITHUB_OUTPUT"

  ##############################
  # Lint and vet jobs
  ##############################

  go-lint:
    name: Go · Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Run linter
        run: test -z "$(gofmt -l sidecar cli)"
      - name: Check coverage markers
        run: sh scripts/check-coverage-markers.sh

  go-vet:
    name: Go · Vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: ${{ github.job }}-ubuntu-24.04
          go-cache-mode: ${{ env.CACHE_MODE }}
      # The macOS and Windows runners run tests alone, so this job is the one
      # place the _darwin.go and _windows.go files are vetted. The sidecar
      # splits by GOARCH on Linux (seccomp_linux_<arch>.go) and by the debug
      # and live-check tags, so it is vetted under each.
      - name: Vet sidecar
        working-directory: ./sidecar
        run: |
          GOOS=linux GOARCH=amd64 go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
          go vet -tags debug ./...
          go vet -tags livecache ./internal/agent/catalog
          go vet -tags liveswitch ./internal/agent/catalog
      - name: Vet CLI
        working-directory: ./cli
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      - name: Vet tools
        working-directory: ./tools
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      - name: Check sidecar dependencies
        run: sh scripts/check-sidecar-deps.sh
      - name: Check go fix
        run: sh scripts/check-go-fix.sh
      # After every pass, so the cache holds the darwin and Windows builds too,
      # and a failed job leaves the last cache the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  go-staticcheck:
    name: Go · Staticcheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: ${{ github.job }}-ubuntu-24.04
          go-cache-mode: ${{ env.CACHE_MODE }}
      # Staticcheck keeps its analysis apart from GOCACHE, so it has a cache of
      # its own, kept by the same CACHE_MODE rules as the Go cache.
      - name: Restore staticcheck cache
        if: env.CACHE_MODE != 'rebuild'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/staticcheck
          # Never matches, so restore-keys finds the newest cache.
          key: doesntexist
          restore-keys: staticcheck-ubuntu-24.04-run-
      # tools/go.mod pins staticcheck, where Dependabot moves it.
      - name: Run staticcheck
        env:
          STATICCHECK_CACHE: ${{ runner.temp }}/staticcheck
        run: sh scripts/staticcheck.sh
      # After the run, so a failed job leaves the last caches the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}
      - name: Save staticcheck cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/staticcheck
          key: staticcheck-ubuntu-24.04-run-${{ github.run_id }}

  rust-lint:
    name: Rust · Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
      - name: Run format check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check
      - name: Check coverage markers
        run: sh scripts/check-coverage-markers.sh

  # Runs the pull request's legs on every event: nothing in src-tauri branches
  # on the architecture or the macOS release, so one runner per OS sees every
  # lint.
  rust-vet:
    name: Rust · Vet (${{ matrix.os }}, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.pull-request-legs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - uses: ./.github/actions/stub-sidecar
      # --all-targets lints the tests too, as make vet-rust does.
      - name: Run clippy
        working-directory: ./src-tauri
        run: cargo clippy --all --all-targets -- -D warnings

  shell-lint:
    name: Shell · Lint
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: make lint-sh

  yaml-lint:
    name: YAML · Lint
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The token turns on zizmor's online audits, which check each pin's
      # commit and version comment against the action's repository.
      - name: Run yamllint, actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-yaml

  # Runs on every PR: one that moves a file a doc links to may touch no Markdown.
  markdown-lint:
    name: Markdown · Lint
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect tracked Markdown files
        run: git ls-files '*.md' > "$RUNNER_TEMP/markdown-files"
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Keep in step with version in scripts/check-markdown-links.sh.
          lycheeVersion: v0.24.2
          args: >-
            --config .github/ci-config/lychee.toml
            --files-from '${{ runner.temp }}/markdown-files'

  design-lint:
    name: Design · Lint
    needs: changes
    if: needs.changes.outputs.design == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Check the design manifest
        working-directory: ./tools
        run: go run ./designsync check

  typescript-lint:
    name: TypeScript · Lint
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
          node-cache: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Lint Tailwind classes
        run: pnpm lint:tailwind
      - name: Check coverage markers
        run: sh scripts/check-coverage-markers.sh

  ###########################
  # Test jobs
  ###########################

  # Go · Vet type-checks the build; this links the real binary, then runs the
  # tests.
  go-test:
    name: Go · Build and Test (${{ matrix.os }}, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      # The whole history, so every file has the commit that last changed it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-sandbox: "true"
          go-cache-key: ${{ github.job }}-${{ matrix.runner }}
          go-cache-mode: ${{ env.CACHE_MODE }}
      # Go's test cache keys a test on the files it reads by modification time,
      # which a checkout resets, so a test reading a repo file would never
      # replay a restored result.
      - name: Date files by their last commit
        run: go run scripts/restore-mtime.go
      # Outside the tree: a test that lists sidecar/ would see a new binary on
      # every run.
      - name: Build
        working-directory: ./sidecar
        run: go build -o ${{ runner.temp }}
      # The race detector does not support windows/arm64, so it alone runs the
      # tests without -race.
      - name: Run tests
        if: ${{ matrix.os == 'windows' && matrix.arch == 'arm64' }}
        working-directory: ./sidecar
        run: go test ./...
      # -race also turns on checkptr, which spends a quarter of agent/chat's
      # CPU checking modernc's SQLite. It is off there alone; our code keeps it.
      # The login shell's tests read SSH_AUTH_SOCK, so its value keys their
      # cached results, and on macOS launchd sets a new path on every boot.
      # -short: a sweep a test shrinks under it runs whole in the stress workflow.
      - name: Run race tests
        if: ${{ !(matrix.os == 'windows' && matrix.arch == 'arm64') }}
        working-directory: ./sidecar
        env:
          SSH_AUTH_SOCK: ""
        run: go test -race -short -gcflags='modernc.org/...=-d=checkptr=0' ./...
      - name: Run CLI tests
        if: ${{ matrix.os == 'windows' && matrix.arch == 'arm64' }}
        working-directory: ./cli
        run: go test ./...
      - name: Run CLI race tests
        if: ${{ !(matrix.os == 'windows' && matrix.arch == 'arm64') }}
        working-directory: ./cli
        run: go test -race ./...
      # The tools run in CI and on maintainers' machines, never on Windows.
      - name: Run tools tests
        if: ${{ matrix.os != 'windows' }}
        working-directory: ./tools
        run: go test ./...
      # After every test passed, so a failed job leaves its runner's last cache
      # the newest. The test flags must match a PR's, or a PR replays nothing.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  # Builds Kstack's own bwrap and pasta, loads their AppArmor profiles through
  # the .deb's postinst on a stock 24.04, where user namespaces are restricted,
  # and runs the sandbox's chains through them as an ordinary user.
  sandbox-apparmor:
    name: Sandbox · Check AppArmor profiles (${{ matrix.os }}, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      # Unrestricted, the check proves nothing about the profiles.
      - name: Assert user namespaces are restricted
        run: test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
      # The sidecar's seccomp filter is per architecture, and a pull request's
      # Go · Build and Test runs on amd64 alone. TestTheFilter* read the
      # filter's verdicts; TestTheShell* install it and ask the kernel.
      - name: Test the seccomp filter
        working-directory: ./sidecar
        run: go test -run '^TestThe(Filter|Shell)' ./internal/run/sandbox
      - name: Build bwrap and pasta
        run: make build-bwrap build-pasta
      - name: Build the sidecar
        working-directory: ./sidecar
        run: go build -o kstack-sidecar .
      # Where the .deb puts them, since each profile attaches by path.
      - name: Install as the .deb does
        run: |
          sudo install -D -m 0755 sidecar/kstack-sidecar /usr/bin/kstack-sidecar
          sudo install -D -m 0755 src-tauri/linux/bwrap /usr/lib/kstack/bwrap
          sudo install -D -m 0755 src-tauri/linux/pasta /usr/lib/kstack/pasta
          sudo install -D -m 0644 src-tauri/linux/kstack-bwrap /usr/lib/kstack/apparmor/kstack-bwrap
          sudo install -D -m 0644 src-tauri/linux/kstack-pasta /usr/lib/kstack/apparmor/kstack-pasta
          sudo sh src-tauri/linux/postinst.sh configure
          sudo aa-status | grep -E 'kstack_(bwrap|pasta)'
      - name: Run the sandbox's chains
        run: scripts/check-sandbox-chain.sh

  # Rust · Vet's clippy type-checks the build; this links the real binary,
  # then runs the tests.
  rust-test:
    name: Rust · Build and Test (${{ matrix.os }}, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - uses: ./.github/actions/stub-sidecar
      - name: Build
        working-directory: ./src-tauri
        run: cargo build
      - name: Run tests
        working-directory: ./src-tauri
        run: cargo test

  # The shipped app is the release profile, which turns cfg!(debug_assertions)
  # off: is_app_origin refuses the dev server, the data directories and the
  # keychain service lose "-dev", and Windows builds a GUI binary. On the
  # runners release-desktop.yml builds the app on, so the Linux leg links
  # Ubuntu 22.04's glibc and webkit2gtk, the oldest a user installs on. Push and
  # dispatch only, since a release build is slow.
  # → docs/adr/2026-11-10-main-builds-and-tests-the-release-profile.md
  rust-test-release:
    name: Rust · Release Build and Test (${{ matrix.os }}, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
          - os: macos
            arch: arm64
            runner: macos-26
          - os: windows
            arch: amd64
            runner: windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - uses: ./.github/actions/stub-sidecar
      - name: Build
        working-directory: ./src-tauri
        run: cargo build --release
      - name: Run tests
        working-directory: ./src-tauri
        run: cargo test --release

  typescript-test:
    name: TypeScript · Test
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
          node-cache: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test run

  ###########################
  # Build jobs
  ###########################

  typescript-build:
    name: TypeScript · Build
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
          node-cache: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  ###########################
  # Cache jobs
  ###########################

  # A run that saves caches leaves one copy of each on its ref: the newest,
  # which a failed save leaves the last good one. It runs last because
  # rust-cache and setup-node save in post steps, which no later step in their
  # own job can follow.
  cache-prune:
    name: Caches · Prune
    needs:
      - changes
      - go-vet
      - go-staticcheck
      - go-test
      - rust-vet
      - rust-test
      - rust-test-release
      - typescript-lint
      - typescript-test
      - typescript-build
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.cache-mode != 'use'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/prune-caches
      - uses: ./.github/actions/prune-caches
