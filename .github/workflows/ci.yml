name: ci

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  # A run on main updates the Go caches every PR reads.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cache-mode:
        description: >-
          use: restore the Go and Rust caches, save none. update: also save a
          new Go cache. rebuild: start the Go cache from empty and save it.
          Off main, a saved cache is that branch's alone; PRs never read it.
        type: choice
        options:
          - use
          - update
          - rebuild
        default: use

# A PR's new push cancels its last run. Every other run has a group of its own,
# so a run on main is never cancelled, which would save no cache, nor left
# pending behind another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # use, update or rebuild: the one place that decides whether a run saves a
  # Go or Rust cache. An update or a rebuild saves a new Go cache per job and
  # runner, and Caches · Prune deletes the one it replaces. Rust saves when its
  # Cargo.lock key misses, so it has nothing to update or rebuild. A dispatch
  # takes its input; a push to main updates; a PR carries no inputs, so it
  # uses, since a PR saving its own copy pushes the repo past its cache limit.
  CACHE_MODE: ${{ inputs.cache-mode || github.ref == 'refs/heads/main' && 'update' || 'use' }}
  # Full debug info swells the Rust caches and slows linking; line tables keep
  # file:line in test backtraces. Workflow-wide, since rust-cache keys on CARGO_*
  # variables and audit.yml's Rust · Audit borrows Rust · Vet's cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # A pull request runs a language's jobs only when a path they read changed.
  # A push or a dispatch runs them all, so main stays the safety net for a path
  # a filter misses and keeps saving the caches PRs read. Each language job
  # checks its own filter, so tests start beside lint and vet rather than
  # after them.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      cache-mode: ${{ env.CACHE_MODE }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      shell: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shell == 'true' }}
      yaml: ${{ github.event_name != 'pull_request' || steps.filter.outputs.yaml == 'true' }}
      markdown: ${{ github.event_name != 'pull_request' || steps.filter.outputs.markdown == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Go covers what Sandbox · AppArmor builds and runs. Rust builds
          # against a stub sidecar, so the sidecar is not its input.
          filters: |
            shared: &shared
              - .github/actions/setup-environment/**
              - .github/workflows/ci.yml
              - .github/codecov.yml
              - scripts/check-coverage-markers.sh
            go:
              - *shared
              - Makefile
              - proto/**
              - scripts/**
              - sidecar/**
              - src-tauri/linux/**
              - tools/**
            rust:
              - *shared
              - .github/actions/stub-sidecar/**
              - proto/**
              - src-tauri/**
              - tools/coverignore/**
            typescript:
              - *shared
              - .gitignore
              - Makefile
              - public/**
              - src/**
              - sidecar/graph/schema.graphqls
              - .oxfmtrc.json
              - codegen.ts
              - eslint.config.ts
              - index.html
              - index.test.ts
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig*.json
              - vite.config.ts
              - vitest.setup.ts
            shell:
              - .github/workflows/ci.yml
              - '**/*.sh'
            yaml:
              - .github/**
              - .gitignore
              - .yamllint.yml
              - .yamllintignore
              - Makefile
              - '**/*.yml'
              - '**/*.yaml'
            markdown:
              - .github/workflows/ci.yml
              - Makefile
              - '**/*.md'

  ##############################
  # Lint and vet jobs
  ##############################

  go-lint:
    name: Go · Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Run linter
        working-directory: ./sidecar
        run: test -z "$(gofmt -l .)"
      - name: Check coverage markers
        run: sh scripts/check-coverage-markers.sh

  go-vet:
    name: Go · Vet
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: ${{ github.job }}-ubuntu-24.04
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Run vetter
        working-directory: ./sidecar
        run: go vet ./...
      # The Windows runners run tests alone, so this is the one place the
      # _windows.go files are vetted.
      - name: Run vetter (GOOS=windows)
        working-directory: ./sidecar
        run: GOOS=windows go vet ./...
      - name: Check sidecar dependencies
        run: sh scripts/check-sidecar-deps.sh
      - name: Check go fix
        run: sh scripts/check-go-fix.sh
      - name: Test tools
        working-directory: ./tools
        run: go vet ./... && go test ./...
      # After both passes, so the cache holds the Windows target's builds too,
      # and a failed job leaves the last cache the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  go-staticcheck:
    name: Go · Staticcheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          go-cache-key: ${{ github.job }}-ubuntu-24.04
          go-cache-mode: ${{ env.CACHE_MODE }}
      # Staticcheck keeps its analysis apart from GOCACHE, so it has a cache of
      # its own, kept by the same CACHE_MODE rules as the Go cache.
      - name: Restore staticcheck cache
        if: env.CACHE_MODE != 'rebuild'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/staticcheck
          # Never matches, so restore-keys finds the newest cache.
          key: doesntexist
          restore-keys: staticcheck-ubuntu-24.04-run-
      # tools/go.mod pins staticcheck, where Dependabot moves it.
      - name: Run staticcheck
        env:
          STATICCHECK_CACHE: ${{ runner.temp }}/staticcheck
        run: sh scripts/staticcheck.sh
      # After the run, so a failed job leaves the last caches the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}
      - name: Save staticcheck cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/staticcheck
          key: staticcheck-ubuntu-24.04-run-${{ github.run_id }}

  rust-lint:
    name: Rust · Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
      - name: Run format check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check
      - name: Check coverage markers
        run: sh scripts/check-coverage-markers.sh

  rust-vet:
    name: Rust · Vet
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      # Keep in step with the stress job's matrix in stress.yml.
      matrix: &full-matrix
        os:
          - linux
          - macos-15
          - macos-26
          - macos-27
          - windows
        arch:
          - amd64
          - arm64
        exclude:
          # The macOS 27 image is Apple silicon alone.
          - os: macos-27
            arch: amd64
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
          - os: macos-15
            arch: arm64
            runner: macos-15
          - os: macos-26
            arch: arm64
            runner: macos-26
          - os: macos-26
            arch: amd64
            runner: macos-26-intel
          - os: macos-27
            arch: arm64
            runner: xcode-27
          - os: windows
            arch: amd64
            runner: windows-2025-vs2026
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - uses: ./.github/actions/stub-sidecar
      - name: Run clippy
        working-directory: ./src-tauri
        run: cargo clippy --all -- -D warnings

  shell-lint:
    name: Shell · Lint
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck scripts/*.sh src-tauri/linux/*.sh

  yaml-lint:
    name: YAML · Lint
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # The token turns on zizmor's online audits, which check each pin's
      # commit and version comment against the action's repository.
      - name: Run yamllint, actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-yaml

  markdown-lint:
    name: Markdown · Lint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
      - name: Check local Markdown links
        run: make lint-md

  typescript-lint:
    name: TypeScript · Lint
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check coverage markers
        run: sh scripts/check-coverage-markers.sh

  ###########################
  # Test jobs
  ###########################

  # Go · Vet type-checks the build; this links the real binary, then runs the
  # tests.
  go-test:
    name: Go · Build and Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix: *full-matrix
    runs-on: ${{ matrix.runner }}
    steps:
      # The whole history, so every file has the commit that last changed it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-sandbox: "true"
          go-cache-key: ${{ github.job }}-${{ matrix.runner }}
          go-cache-mode: ${{ env.CACHE_MODE }}
      # Go's test cache keys a test on the files it reads by modification time,
      # which a checkout resets, so a test reading a repo file would never
      # replay a restored result.
      - name: Date files by their last commit
        run: go run scripts/restore-mtime.go
      # Outside the tree: a test that lists sidecar/ would see a new binary on
      # every run.
      - name: Build
        working-directory: ./sidecar
        run: go build -o ${{ runner.temp }}
      # The race detector does not support windows/arm64, so it alone runs the
      # tests without -race.
      - name: Run tests
        if: ${{ matrix.os == 'windows' && matrix.arch == 'arm64' }}
        working-directory: ./sidecar
        run: go test ./...
      # -race also turns on checkptr, which spends a quarter of agent/chat's
      # CPU checking modernc's SQLite. It is off there alone; our code keeps it.
      # The login shell's tests read SSH_AUTH_SOCK, so its value keys their
      # cached results, and on macOS launchd sets a new path on every boot.
      # -short: a sweep a test shrinks under it runs whole in the stress workflow.
      - name: Run race tests
        if: ${{ !(matrix.os == 'windows' && matrix.arch == 'arm64') }}
        working-directory: ./sidecar
        env:
          SSH_AUTH_SOCK: ""
        run: go test -race -short -gcflags='modernc.org/...=-d=checkptr=0' ./...
      # After every test passed, so a failed job leaves its runner's last cache
      # the newest. The test flags must match a PR's, or a PR replays nothing.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  go-coverage:
    name: Go · Coverage (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      # One runner per OS: every platform split in the sidecar is by OS, none
      # by architecture, so three profiles hold every file. macOS 27 is the
      # release users run; nothing in the sidecar branches on the macOS version.
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: darwin
            runner: xcode-27
          - os: windows
            runner: windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    # Twice each suite run's -timeout, so a hang fails the test binary with a
    # goroutine dump before the runner kills the job.
    timeout-minutes: 60
    permissions:
      contents: read
      # Codecov's upload authenticates with an OIDC token.
      id-token: write
    steps:
      # The whole history, for the same reason as Go · Build and Test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          # macOS skips its Seatbelt tests without KSTACK_REQUIRE_SANDBOX=1.
          setup-sandbox: "true"
          go-cache-key: ${{ github.job }}-${{ matrix.runner }}
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Date files by their last commit
        run: go run scripts/restore-mtime.go
      # Built as scripts/build-sidecar.go ships it, so the run tests the
      # pure-Go os/user and net resolver the release uses. A cached test
      # replays its coverage with it. SSH_AUTH_SOCK is pinned as in Go · Build
      # and Test, since its value keys the login shell's cached results.
      # -coverpkg=./... counts a helper exercised only from another package's
      # tests. Instrumenting every package, with no -short, is too slow for
      # Go's 10-minute default per test binary on Windows. Both passes run in
      # bash: PowerShell splits -coverpkg=./... at its dot, which empties
      # -coverpkg and hands ./... to the test binary, turning off the test cache.
      - name: Measure coverage
        working-directory: ./sidecar
        shell: bash
        env:
          CGO_ENABLED: "0"
          SSH_AUTH_SOCK: ""
        run: >-
          go test -timeout 30m -covermode=atomic -coverpkg=./...
          -coverprofile="$RUNNER_TEMP/untagged.out" ./...
      # -tags debug compiles the environment overrides, which no other build has.
      - name: Measure coverage (-tags debug)
        working-directory: ./sidecar
        shell: bash
        env:
          CGO_ENABLED: "0"
          SSH_AUTH_SOCK: ""
        run: >-
          go test -tags debug -timeout 30m -covermode=atomic -coverpkg=./...
          -coverprofile="$RUNNER_TEMP/debug.out" ./...
      - name: Merge the profiles and drop marked lines
        working-directory: ./tools
        run: >-
          go run ./coverignore -dir ../sidecar -o ${{ runner.temp }}/coverage-${{ matrix.os }}.out
          ${{ runner.temp }}/untagged.out ${{ runner.temp }}/debug.out
      # A fork's PR cannot mint the OIDC token; the action then uploads
      # tokenless, which Codecov accepts for a public repository.
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage-${{ matrix.os }}.out
          disable_search: true
          flags: go-${{ matrix.os }}
          fail_ci_if_error: true
      # After the upload, so a failed job leaves the last cache the newest.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  # Builds Kstack's own bwrap and pasta, loads their AppArmor profiles through
  # the .deb's postinst on a stock 24.04, where user namespaces are restricted,
  # and runs the sandbox's chains through them as an ordinary user.
  sandbox-apparmor:
    name: Sandbox · AppArmor · Ubuntu 24.04
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      # Unrestricted, the check proves nothing about the profiles.
      - name: Assert user namespaces are restricted
        run: test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
      - name: Build bwrap and pasta
        run: make bwrap pasta
      - name: Build the sidecar
        working-directory: ./sidecar
        run: go build -o kstack-sidecar .
      # Where the .deb puts them, since each profile attaches by path.
      - name: Install as the .deb does
        run: |
          sudo install -D -m 0755 sidecar/kstack-sidecar /usr/bin/kstack-sidecar
          sudo install -D -m 0755 src-tauri/linux/bwrap /usr/lib/kstack/bwrap
          sudo install -D -m 0755 src-tauri/linux/pasta /usr/lib/kstack/pasta
          sudo install -D -m 0644 src-tauri/linux/kstack-bwrap /usr/lib/kstack/apparmor/kstack-bwrap
          sudo install -D -m 0644 src-tauri/linux/kstack-pasta /usr/lib/kstack/apparmor/kstack-pasta
          sudo sh src-tauri/linux/postinst.sh configure
          sudo aa-status | grep -E 'kstack_(bwrap|pasta)'
      - name: Run the sandbox's chains
        run: scripts/check-sandbox-chain.sh

  typescript-coverage:
    name: TypeScript · Coverage
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Measure coverage
        run: pnpm vitest run --mode coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          flags: typescript
          fail_ci_if_error: true

  # One runner per OS, as Go · Coverage: Rust's platform splits are by OS.
  # The instrumented build is its own profile, so it keeps its own cache.
  rust-coverage:
    name: Rust · Coverage (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: xcode-27
          - os: windows
            runner: windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          setup-go: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - uses: ./.github/actions/stub-sidecar
      # The action's release fixes cargo-llvm-cov's version and checksums.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        working-directory: ./src-tauri
        run: cargo llvm-cov --lcov --output-path ${{ runner.temp }}/rust-${{ matrix.os }}.lcov
      - name: Drop marked lines
        working-directory: ./tools
        run: >-
          go run ./coverignore -lcov -o ${{ runner.temp }}/rust-${{ matrix.os }}-filtered.lcov
          ${{ runner.temp }}/rust-${{ matrix.os }}.lcov
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/rust-${{ matrix.os }}-filtered.lcov
          disable_search: true
          flags: rust-${{ matrix.os }}
          fail_ci_if_error: true

  # Reads Codecov's merged result once every upload above is processed, and
  # fails on an uncovered changed line or a drop in the total
  # (tools/coveragegate). Codecov's public API needs no token, so a fork's PR
  # runs it too. A language whose job failed is not waited for.
  coverage-gate:
    name: Coverage · Gate
    needs:
      - go-coverage
      - typescript-coverage
      - rust-coverage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Gate on Codecov's merged result
        working-directory: ./tools
        env:
          GO_RESULT: ${{ needs.go-coverage.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript-coverage.result }}
          RUST_RESULT: ${{ needs.rust-coverage.result }}
          # Codecov records a PR's uploads under its head, not the merge commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number || 0 }}
        run: |
          flags=""
          if [ "$GO_RESULT" = success ]; then flags="$flags,go-linux,go-darwin,go-windows"; fi
          if [ "$TYPESCRIPT_RESULT" = success ]; then flags="$flags,typescript"; fi
          if [ "$RUST_RESULT" = success ]; then flags="$flags,rust-linux,rust-macos,rust-windows"; fi
          go run ./coveragegate -sha "$SHA" -pr "$PR" -flags "${flags#,}" \
            -run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # Rust · Vet's clippy type-checks the build; this links the real binary,
  # then runs the tests.
  rust-test:
    name: Rust · Build and Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix: *full-matrix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - uses: ./.github/actions/stub-sidecar
      - name: Build
        working-directory: ./src-tauri
        run: cargo build
      - name: Run tests
        working-directory: ./src-tauri
        run: cargo test

  typescript-test:
    name: TypeScript · Test
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test run

  ###########################
  # Build jobs
  ###########################

  typescript-build:
    name: TypeScript · Build
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  ###########################
  # Cache jobs
  ###########################

  # A run that saves caches leaves one copy of each on its ref: the newest,
  # which a failed save leaves the last good one. It runs last because
  # rust-cache and setup-node save in post steps, which no later step in their
  # own job can follow.
  cache-prune:
    name: Caches · Prune
    needs:
      - changes
      - go-vet
      - go-staticcheck
      - go-test
      - go-coverage
      - rust-vet
      - rust-test
      - rust-coverage
      - typescript-lint
      - typescript-coverage
      - typescript-test
      - typescript-build
    if: always() && needs.changes.outputs.cache-mode != 'use'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Prune caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/prune-caches.sh "$GITHUB_REF"
