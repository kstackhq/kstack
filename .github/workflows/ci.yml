name: ci

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"
  # A run on main updates the Go caches every PR reads.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cache-mode:
        description: >-
          use: restore the Go and Rust caches, save none. update: also save a
          new Go cache. rebuild: start the Go cache from empty and save it.
          Off main, a saved cache is that branch's alone; PRs never read it.
        type: choice
        options:
          - use
          - update
          - rebuild
        default: use

# A PR's new push cancels its last run. Every other run has a group of its own,
# so a run on main is never cancelled, which would save no cache, nor left
# pending behind another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # use, update or rebuild: the one place that decides whether a run saves a
  # Go or Rust cache. An update or a rebuild saves a new Go cache per job and
  # runner; the one it replaces is never restored again, so it is the first
  # GitHub evicts. Rust saves when its Cargo.lock key misses, so it has nothing
  # to update or rebuild. A dispatch takes its input; a push to main updates;
  # a PR carries no inputs, so it uses, since a PR saving its own copy pushes
  # the repo past its cache limit.
  CACHE_MODE: ${{ inputs.cache-mode || github.ref == 'refs/heads/main' && 'update' || 'use' }}
  # Full debug info swells the Rust caches and slows linking; line tables keep
  # file:line in test backtraces. Workflow-wide, since rust-cache keys on CARGO_*
  # variables and Rust · Audit borrows Rust · Vet's cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ##############################
  # Pre-flight jobs
  ##############################

  go-lint:
    name: Go · Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Run linter
        working-directory: ./sidecar
        run: test -z "$(gofmt -l .)"

  go-vet:
    name: Go · Vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Run vetter
        working-directory: ./sidecar
        run: go vet ./...
      # The Windows runners run tests alone, so this is the one place the
      # _windows.go files are vetted.
      - name: Run vetter (GOOS=windows)
        working-directory: ./sidecar
        run: GOOS=windows go vet ./...

  rust-lint:
    name: Rust · Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
      - name: Run format check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check

  rust-vet:
    name: Rust · Vet
    strategy:
      fail-fast: false
      matrix: &full-matrix
        os:
          - linux
          - macos-15
          - macos-26
          - macos-27
          - windows
        arch:
          - amd64
          - arm64
        exclude:
          # The macOS 27 image is Apple silicon alone.
          - os: macos-27
            arch: amd64
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos-15
            arch: amd64
            runner: macos-15-intel
          - os: macos-15
            arch: arm64
            runner: macos-15
          - os: macos-26
            arch: arm64
            runner: macos-26
          - os: macos-26
            arch: amd64
            runner: macos-26-intel
          - os: macos-27
            arch: arm64
            runner: xcode-27
          - os: windows
            arch: amd64
            runner: windows-2025-vs2026
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - name: Stub sidecar binary
        shell: bash
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          EXT=""
          case "$TRIPLE" in *windows*) EXT=".exe" ;; esac
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/kstack-sidecar-$TRIPLE$EXT"
      - name: Run clippy
        working-directory: ./src-tauri
        run: cargo clippy --all -- -D warnings

  shell-lint:
    name: Shell · Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck scripts/*.sh src-tauri/linux/*.sh

  typescript-lint:
    name: TypeScript · Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  ###########################
  # Audit jobs
  ###########################

  go-audit:
    name: Go · Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      - name: Run govulncheck
        working-directory: ./sidecar
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  rust-audit:
    name: Rust · Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          # Nothing here compiles worth saving, so it borrows Rust · Vet's
          # registry and index.
          rust-cache-key: rust-vet-ubuntu-24.04
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Run cargo audit
        working-directory: ./src-tauri
        run: cargo audit --deny unsound --deny unmaintained

  typescript-audit:
    name: TypeScript · Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate

  ###########################
  # Test jobs
  ###########################

  # Go · Vet already type-checks the build; this links the real binary, then
  # runs the tests under the same cache.
  go-test:
    name: Go · Build and Test
    needs:
      - go-lint
      - go-vet
    strategy:
      fail-fast: false
      matrix: *full-matrix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-sandbox: "true"
          go-cache-key: ${{ github.job }}-${{ matrix.runner }}
          go-cache-mode: ${{ env.CACHE_MODE }}
      - name: Build
        working-directory: ./sidecar
        run: go build
      - name: Run tests
        working-directory: ./sidecar
        run: go test ./...
      - name: Run race tests
        if: ${{ !(matrix.os == 'windows' && matrix.arch == 'arm64') }}
        working-directory: ./sidecar
        run: go test -race ./...
      # After every test passed, so a failed job leaves its runner's last cache
      # the newest. The test flags must match a PR's, or a PR replays nothing.
      - name: Save Go cache
        if: env.CACHE_MODE != 'use'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.go-cache-path }}
          key: ${{ steps.setup.outputs.go-cache-key }}

  go-coverage:
    name: Go · Coverage
    needs:
      - go-lint
      - go-vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-sandbox: "true"
      - name: Check coverage against the threshold
        working-directory: ./sidecar
        run: go run scripts/coverage.go -report

  # Builds Kstack's own bwrap and pasta, loads their AppArmor profiles through
  # the .deb's postinst on a stock 24.04, where user namespaces are restricted,
  # and runs the sandbox's chains through them as an ordinary user.
  sandbox-apparmor:
    name: Sandbox · AppArmor · Ubuntu 24.04
    needs:
      - go-lint
      - go-vet
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
      # Unrestricted, the check proves nothing about the profiles.
      - name: Assert user namespaces are restricted
        run: test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
      - name: Build bwrap and pasta
        run: make bwrap pasta
      - name: Build the sidecar
        working-directory: ./sidecar
        run: go build -o kstack-sidecar .
      # Where the .deb puts them, since each profile attaches by path.
      - name: Install as the .deb does
        run: |
          sudo install -D -m 0755 sidecar/kstack-sidecar /usr/bin/kstack-sidecar
          sudo install -D -m 0755 src-tauri/linux/bwrap /usr/lib/kstack/bwrap
          sudo install -D -m 0755 src-tauri/linux/pasta /usr/lib/kstack/pasta
          sudo install -D -m 0644 src-tauri/linux/kstack-bwrap /usr/lib/kstack/apparmor/kstack-bwrap
          sudo install -D -m 0644 src-tauri/linux/kstack-pasta /usr/lib/kstack/apparmor/kstack-pasta
          sudo sh src-tauri/linux/postinst.sh configure
          sudo aa-status | grep -E 'kstack_(bwrap|pasta)'
      - name: Run the sandbox's chains
        run: scripts/check-sandbox-chain.sh

  typescript-coverage:
    name: TypeScript · Coverage
    needs:
      - typescript-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check coverage against the threshold
        run: make cover-js

  # Rust · Vet's clippy already type-checks the build; this links the real
  # binary, then runs the tests under the same cache.
  rust-test:
    name: Rust · Build and Test
    needs:
      - rust-lint
      - rust-vet
    strategy:
      fail-fast: false
      matrix: *full-matrix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"
          setup-rust: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache-key: ${{ github.job }}-${{ matrix.runner }}
          cache-save: ${{ env.CACHE_MODE != 'use' }}
      - name: Build sidecar
        shell: bash
        run: go run scripts/build-sidecar.go
      - name: Build
        working-directory: ./src-tauri
        run: cargo build
      - name: Run tests
        working-directory: ./src-tauri
        run: cargo test

  typescript-test:
    name: TypeScript · Test
    needs:
      - typescript-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test run

  ###########################
  # Build jobs
  ###########################

  typescript-build:
    name: TypeScript · Build
    needs:
      - typescript-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
