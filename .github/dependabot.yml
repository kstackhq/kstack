version: 2
updates:
  # Every action is pinned to a commit SHA; this moves the pins and the
  # version comments beside them.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # A week for a compromised release to be caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
