packages:
  - .
allowBuilds:
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
overrides:
  '@graphql-tools/utils@11': ^12.0.1
  es-abstract: 1.24.1
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  browserslist: ^4.28.8
  js-yaml@4: ^4.3.2
  shell-quote: ^1.11.0
  ws: ^8.21.3
  zod@4: ^4.6.6
auditConfig:
  ignoreGhsas:
    # braces <= 3.0.3 (every release) has no patch. Dev-only, under ESLint and
    # GraphQL codegen, expanding our own globs. Remove once braces ships a fix.
    # → docs/adr/2026-10-03-ignore-the-braces-advisory-until-it-has-a-patch.md
    - GHSA-vfj7-8cjw-p6xm
minimumReleaseAgeExclude:
  # Younger than the minimum release age. Drop once it ages past it.
  - fancy-ansi@0.2.2
  - '@asamuzakjp/dom-selector@10.0.5'
  - '@tauri-apps/cli@2.12.4'
  - '@tauri-apps/cli-darwin-arm64@2.12.4'
  - '@tauri-apps/cli-darwin-x64@2.12.4'
  - '@tauri-apps/cli-linux-arm-gnueabihf@2.12.4'
  - '@tauri-apps/cli-linux-arm64-gnu@2.12.4'
  - '@tauri-apps/cli-linux-arm64-musl@2.12.4'
  - '@tauri-apps/cli-linux-riscv64-gnu@2.12.4'
  - '@tauri-apps/cli-linux-x64-gnu@2.12.4'
  - '@tauri-apps/cli-linux-x64-musl@2.12.4'
  - '@tauri-apps/cli-win32-arm64-msvc@2.12.4'
  - '@tauri-apps/cli-win32-ia32-msvc@2.12.4'
  - '@tauri-apps/cli-win32-x64-msvc@2.12.4'
  - '@kubetail/ui@3.0.2'
# Explicit, so a change in pnpm's defaults can't loosen them. The age matches
# Dependabot's 7-day cooldown.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
trustPolicyExclude:
  # semver's 6.x line is still patched after 7.x gained provenance, so its
  # releases carry less trust evidence than the latest one. Not a takeover.
  - semver@6.3.1
